<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الإعدادات · مواطن كوغناي</title>
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../assets/app.css">
<script src="../assets/theme.js" defer></script>
</head>
<body>
<a class="skip" href="#main">انتقل إلى المحتوى</a>
<div class="app">
<header class="bar"><span class="chip">مواطن كوغناي</span><h1>الإعدادات</h1><a class="btn" href="../settings.html" hreflang="en" lang="en" aria-label="اقرأ هذه الشاشة بالإنجليزية">English</a></header>
<main id="main">
<section class="card" aria-labelledby="h-prof"><h2 id="h-prof">مواطنك</h2><div class="row"><img class="avatar" src="../assets/citizen.svg" alt="مواطنك نور، صورة رمزية دائرية بلون التراكوتا" width="56" height="56"><div class="field" style="flex:1"><label for="set-name">اسم المواطن</label><input type="text" id="set-name" name="name" value="نور"></div></div></section>
<section class="card" aria-labelledby="h-theme"><h2 id="h-theme">المظهر</h2><div class="row" role="group" aria-labelledby="h-theme"><button class="btn" type="button" data-set-theme="light">فاتح</button><button class="btn" type="button" data-set-theme="dark">داكن</button><button class="btn" type="button" data-set-theme="system">حسب النظام</button></div>
<div class="field" style="margin-top:var(--space-3)"><label for="set-lang">اللغة</label><select id="set-lang" name="lang"><option value="en">الإنجليزية</option><option value="ar" selected>العربية</option></select></div></section>
<section class="card" aria-labelledby="h-notify"><h2 id="h-notify">الإشعارات</h2><div class="switch"><label for="n-tasks">المهام الجديدة</label><input type="checkbox" id="n-tasks" checked></div><div class="switch"><label for="n-pay">المدفوعات</label><input type="checkbox" id="n-pay" checked></div></section>
<section class="card" aria-labelledby="h-priv"><h2 id="h-priv">الخصوصية</h2><div class="switch"><label for="p-mem">احتفظ بالذاكرة على هذا الجهاز فقط</label><input type="checkbox" id="p-mem" checked></div><p class="row"><a class="btn" href="wallet.html">صدّر ذاكرتي</a></p><p class="muted small">يزيل هذا المواطن وذاكرته من هذا الجهاز.</p><a class="btn btn-danger" href="first-run.html">احذف مواطني</a></section>
</main>
<nav class="nav" aria-label="القائمة الرئيسية"><a href="lobby.html"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="currentColor"/></svg><span>الردهة</span></a><a href="chat.html"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 4h16v12H8l-4 4z" fill="currentColor"/></svg><span>المحادثة</span></a><a href="services.html"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z" fill="currentColor"/></svg><span>الخدمات</span></a><a href="wallet.html"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 7h18v12H3zM3 7l3-3h12l3 3M16 13h3" stroke="currentColor" stroke-width="2" fill="none"/></svg><span>المحفظة</span></a><a href="settings.html" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3" fill="currentColor"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l3 3M16 16l3 3M5 19l3-3M16 8l3-3" stroke="currentColor" stroke-width="2"/></svg><span>الإعدادات</span></a></nav>
</div>
</body>
</html>
